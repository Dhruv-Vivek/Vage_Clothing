name: VAGE Next.js CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/batch-6-payments-email
      - feature/phase-9-10-membership-account

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build
