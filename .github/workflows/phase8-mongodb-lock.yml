name: Phase 8 MongoDB lockfile sync

on:
  push:
    branches:
      - feature/phase-9-10-membership-account
    paths:
      - package.json
      - .github/workflows/phase8-mongodb-lock.yml

permissions:
  contents: write

jobs:
  lock-and-verify:
    if: contains(github.event.head_commit.message, 'Phase 8 MongoDB intelligence')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate npm lockfile for the MongoDB driver
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible install
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build production application
        run: npm run build
      - name: Commit the generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): lock MongoDB driver for Phase 8"
          git push origin "HEAD:$GITHUB_REF_NAME"
